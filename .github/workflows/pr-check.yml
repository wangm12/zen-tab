name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-and-test:
    name: Typecheck, Test & Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, tests & build
        run: npm run check

      - name: Verify package zip
        run: npm run package
